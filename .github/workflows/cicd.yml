name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install backend Dependencies
        run: |
          cd backend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-app ./frontend

      - name: Build backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-app ./backend

      - name: Push frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-app

      - name: Push backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-app
            docker pull ${{ secrets.DOCKER_USERNAME }}/backend-app

            docker stop frontend || true
            docker stop backend || true

            docker rm frontend || true
            docker rm backend || true

            docker run -d --name frontend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/frontend-app
            docker run -d --name backend -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/backend-app
