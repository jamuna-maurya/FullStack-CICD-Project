name: Full Stack CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ==========================================
# Environment Variables
# ==========================================
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:

    # ==========================================
    # Latest Ubuntu Runner
    # ==========================================
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout GitHub Repository
      # OLD: actions/checkout@v4
      # NEW: actions/checkout@v5
      # ==========================================
      - name: Checkout Source Code
        uses: actions/checkout@v5

      # ==========================================
      # 2. Setup Latest Node.js
      # OLD: setup-node@v4
      # NEW: setup-node@v5
      # OLD Node: 20
      # NEW Node: 22
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. Install Frontend Dependencies
      # ==========================================
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # ==========================================
      # 4. Build Frontend
      # ==========================================
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # ==========================================
      # 5. Install Backend Dependencies
      # ==========================================
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # ==========================================
      # 6. Docker Hub Login
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================================
      # 7. Setup Docker Buildx
      # NEW Added for latest Docker builds
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 8. Build & Push Frontend Docker Image
      # OLD: build-push-action@v5
      # NEW: build-push-action@v6
      # ==========================================
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: jamuna22/frontend-app:latest

      # ==========================================
      # 9. Build & Push Backend Docker Image
      # ==========================================
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jamuna22/backend-app:latest

      # ==========================================
      # 10. Success Message
      # ==========================================
      - name: Deployment Success
        run: echo "CI/CD Pipeline executed successfully!"
